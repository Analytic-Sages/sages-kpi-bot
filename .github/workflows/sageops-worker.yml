name: SageOps Scheduled Operations Worker

on:
  # Scheduled workflows run from the repository's default branch.
  # Five-minute polling is sufficient for the current reminder and digest SLA.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sageops-scheduled-operations-worker
  cancel-in-progress: false

jobs:
  process:
    # Never allow a manually dispatched feature branch to process shared data.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SageOps
        run: python -m pip install --disable-pip-version-check -e .

      - name: Validate required configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add DATABASE_URL to GitHub repository Actions secrets."
            exit 1
          fi

      - name: Validate live Telegram configuration
        env:
          TELEGRAM_TEST_MODE: ${{ vars.TELEGRAM_TEST_MODE || 'true' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ "$TELEGRAM_TEST_MODE" != "true" ]; then
            if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
              echo "::error::Live Telegram delivery requires the TELEGRAM_BOT_TOKEN secret."
              exit 1
            fi
            if [ "$DRY_RUN" != "false" ]; then
              echo "::error::Set DRY_RUN=false before enabling live Telegram delivery."
              exit 1
            fi
          fi

      - name: Process one SageOps worker cycle
        env:
          APP_ENV: production
          LOG_LEVEL: INFO
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPERATIONS_NOTIFICATIONS_ENABLED: ${{ vars.OPERATIONS_NOTIFICATIONS_ENABLED || 'true' }}
          TELEGRAM_TEST_MODE: ${{ vars.TELEGRAM_TEST_MODE || 'true' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: python -m app.operations_worker --once
