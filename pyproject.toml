[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "polaris-growth-accountability-bot"
version = "0.1.0"
description = "Polaris: Growth and Accountability Bot for Analytic Sages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.4,<3.0", "apscheduler>=3.10,<4.0",
  "httpx>=0.27,<1.0", "google-auth>=2.34,<3.0",
  "itsdangerous>=2.2,<3.0", "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0", "alembic>=1.13,<2.0",
  "openpyxl>=3.1,<4.0", "sentry-sdk[fastapi]>=2.0,<3.0", "boto3>=1.35,<2.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0","pytest-asyncio>=0.24,<1.0","pytest-cov>=5.0,<7.0","ruff>=0.6,<1.0","playwright>=1.65,<2.0"]
[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E","F","I","UP","B"]
ignore = ["E501","B008","I001","E701","E702"]
